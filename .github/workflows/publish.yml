name: Publish

# Tag pushes run the full publish. Manual runs only package/verify unless
# dry_run is explicitly cleared.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify without uploading
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag and version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" == "v$version" ]] || {
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          }
      - name: Package and verify
        run: cargo publish --locked --dry-run
      - name: Publish to crates.io
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
