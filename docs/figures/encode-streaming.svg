<rect x="16.0" y="16.0" width="1028.0" height="74.0" rx="10" fill="url(#grad-header)"/><text x="34.0" y="46.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#ffffff" text-anchor="start" font-weight="700">Cache-Aware Encode &amp; Non-Temporal Streaming</text><text x="34.0" y="70.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="start" font-weight="400">Cached stores for hot reused buffers · Non-temporal stores to avoid Read-For-Ownership (RFO) above LLC threshold</text><rect x="894.6" y="30.0" width="133.4" height="26.0" rx="13" fill="#b45309"/><text x="961.3" y="47.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle" font-weight="700">258 vs 599 MiB RSS</text><rect x="721.7" y="30.0" width="164.9" height="26.0" rx="13" fill="#1d4ed8"/><text x="804.2" y="47.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#dbeafe" text-anchor="middle" font-weight="700">1.39–1.68× Cold Speedup</text><rect x="574.0" y="30.0" width="139.7" height="26.0" rx="13" fill="#0f766e"/><text x="643.9" y="47.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ccfbf1" text-anchor="middle" font-weight="700">3/7 LLC Auto-Switch</text><rect x="16.0" y="104.0" width="1028.0" height="316.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/><rect x="36.0" y="124.0" width="248.0" height="78.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="52.0" y="148.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#0d9488" text-anchor="start" font-weight="700">Codec::encode</text><text x="52.0" y="170.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">Default slice / Vec API</text><text x="52.0" y="188.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">Hot or reused buffers</text><rect x="36.0" y="218.0" width="248.0" height="78.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="52.0" y="242.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">Codec::encode_streaming</text><text x="52.0" y="264.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">One-shot cold output API</text><text x="52.0" y="282.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">Socket / file / arena buffers</text><rect x="36.0" y="312.0" width="248.0" height="78.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><text x="52.0" y="336.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#d97706" text-anchor="start" font-weight="700">Codec::encode_to_writer</text><text x="52.0" y="358.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">Bounded-memory I/O API</text><text x="52.0" y="376.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">Fixed 64 KiB chunk buffer</text><rect x="336.0" y="124.0" width="316.0" height="172.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><rect x="336.0" y="124.0" width="316.0" height="28.0" rx="8" fill="#f0fdfa"/><text x="494.0" y="143.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700">LLC Working-Set Policy (src/cpu.rs)</text><text x="494.0" y="172.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="400">working_set = input_len + encoded_len</text><text x="494.0" y="196.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">• encode: NT stores when working_set &gt; 3/7 LLC</text><text x="494.0" y="218.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">• encode_streaming: NT stores from 4 KiB+</text><text x="494.0" y="240.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">• 3-cache-line prefetch per 192 B AVX2 iter</text><text x="494.0" y="262.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="600">• Short 8/16/32B: single 24B load + pad overwrite</text><line x1="284.0" y1="163.0" x2="334.0" y2="163.0" stroke="#0f766e" stroke-width="2.0" marker-end="url(#arrow-teal)"/><line x1="284.0" y1="257.0" x2="334.0" y2="220.0" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#arrow-blue)"/><rect x="336.0" y="312.0" width="316.0" height="90.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="494.0" y="336.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">Memory &amp; Parallel Crossover</text><text x="494.0" y="358.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">• encode_to_writer: 256 MiB input uses 258 MiB RSS</text><text x="494.0" y="378.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">• encode_parallel: 4 workers in 4–6.5 MiB window;</text><text x="494.0" y="394.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">  auto-selects 1-thread NT above LLC bandwidth limit</text><line x1="284.0" y1="351.0" x2="334.0" y2="351.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="704.0" y="124.0" width="320.0" height="128.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/><text x="864.0" y="150.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700">Cached AVX2 Stores (_mm256_storeu)</text><text x="864.0" y="174.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="400">Keeps output warm in L1/L2/L3 cache</text><text x="864.0" y="196.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">22.5 GB/s at 64 KiB · 22.3 GB/s at 1 MiB</text><text x="864.0" y="218.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Optimal when caller immediately reads output</text><rect x="704.0" y="274.0" width="320.0" height="128.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="864.0" y="300.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Non-Temporal Stores (_mm_stream_si128)</text><text x="864.0" y="324.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="400">Bypasses cache · Eliminates output RFO traffic</text><text x="864.0" y="346.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">16 MiB: 7.36 → 13.0 GB/s (1.77× speedup)</text><text x="864.0" y="368.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Cold 4K–4M: 1.39–1.68× faster than cached encode</text><line x1="652.0" y1="172.0" x2="702.0" y2="172.0" stroke="#0f766e" stroke-width="2.0" marker-end="url(#arrow-teal)"/><line x1="652.0" y1="232.0" x2="702.0" y2="320.0" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#arrow-blue)"/><text x="24.0" y="446.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">yolow64 v0.3.0 · Adaptive LLC detection via CPUID leaf 4 (x86_64) &amp; sysfs fallback</text>
</svg>
