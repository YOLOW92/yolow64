<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Encode write-policy diagram">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48.0" y="48.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">Encode write policy</text><text x="48.0" y="74.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="400" opacity="1.0">Cached stores for reused buffers; non-temporal stores for one-shot and large outputs.</text><rect x="48.0" y="128.0" width="250.0" height="88.0" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="173.0" y="156.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700" opacity="1.0">working set</text><text x="173.0" y="178.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">input + output</text><text x="173.0" y="195.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">against detected LLC</text><line x1="298.0" y1="172.0" x2="348.0" y2="172.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><polygon points="456,112 558,172 456,232 354,172" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="456.0" y="168.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700" opacity="1.0">below</text><text x="456.0" y="188.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700" opacity="1.0">3/7 LLC?</text><line x1="558.0" y1="172.0" x2="608.0" y2="172.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="580.0" y="162.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="600" opacity="1.0">yes</text><rect x="608.0" y="128.0" width="250.0" height="88.0" rx="10" fill="#f8fafc" stroke="#15803d" stroke-width="1.5"/><text x="733.0" y="156.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700" opacity="1.0">cached stores</text><text x="733.0" y="178.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">default encode</text><text x="733.0" y="195.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">reused / reread buffers</text><line x1="456.0" y1="232.0" x2="456.0" y2="306.0" stroke="#64748b" stroke-width="2"/><line x1="456.0" y1="306.0" x2="608.0" y2="306.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="466.0" y="274.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="600" opacity="1.0">no</text><rect x="608.0" y="272.0" width="250.0" height="88.0" rx="10" fill="#f8fafc" stroke="#b45309" stroke-width="1.5"/><text x="733.0" y="300.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700" opacity="1.0">NT stores</text><text x="733.0" y="322.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">single-thread streaming</text><text x="733.0" y="339.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">no read-for-ownership</text><text x="48.0" y="398.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" opacity="1.0">encode_streaming: NT from 4 KiB when the output is 16-byte aligned; encode keeps the 3/7 LLC rule.</text><text x="48.0" y="422.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" opacity="1.0">Unknown LLC or unaligned output falls back to cached stores.</text><text x="48.0" y="512.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" opacity="0.9">yolow64 0.2.0 · threshold scales with the detected last-level cache</text>
</svg>
