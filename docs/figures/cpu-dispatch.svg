<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48.0" y="48.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">CPU dispatch and fallback</text><text x="48.0" y="74.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="400" opacity="1.0">AVX2 and BMI2 are independent feature bits. AVX2 does not imply PEXT.</text><rect x="48.0" y="150.0" width="200.0" height="86.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="148.0" y="178.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#64748b" text-anchor="middle" font-weight="700" opacity="1.0">decode call</text><text x="148.0" y="200.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">length + padding</text><text x="148.0" y="217.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">strict / whitespace</text><line x1="248.0" y1="193.0" x2="300.0" y2="193.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><polygon points="300,193 380,143 460,193 380,243" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/><text x="380.0" y="188.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="700" opacity="1.0">AVX2?</text><text x="380.0" y="207.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">available?</text><line x1="460.0" y1="193.0" x2="540.0" y2="193.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="500.0" y="183.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="600" opacity="1.0">yes</text><polygon points="540,193 620,143 700,193 620,243" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/><text x="620.0" y="188.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="700" opacity="1.0">BMI2?</text><text x="620.0" y="207.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">available?</text><line x1="700.0" y1="193.0" x2="754.0" y2="193.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="727.0" y="183.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="600" opacity="1.0">yes</text><rect x="754.0" y="145.0" width="240.0" height="96.0" rx="10" fill="#f8fafc" stroke="#15803d" stroke-width="1.5"/><text x="874.0" y="173.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700" opacity="1.0">fast paths</text><text x="874.0" y="195.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">BMI2 pext tails</text><text x="874.0" y="212.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">24 / 44 / 172</text><text x="874.0" y="229.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">AVX2 bulk otherwise</text><line x1="380.0" y1="243.0" x2="380.0" y2="320.0" stroke="#64748b" stroke-width="2"/><line x1="380.0" y1="320.0" x2="380.0" y2="330.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="390.0" y="285.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="600" opacity="1.0">no</text><rect x="270.0" y="330.0" width="220.0" height="86.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="380.0" y="358.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#64748b" text-anchor="middle" font-weight="700" opacity="1.0">scalar path</text><text x="380.0" y="380.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">no AVX2</text><text x="380.0" y="397.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">same bytes / errors</text><line x1="620.0" y1="243.0" x2="620.0" y2="320.0" stroke="#64748b" stroke-width="2"/><line x1="620.0" y1="320.0" x2="620.0" y2="330.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="630.0" y="285.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="600" opacity="1.0">no</text><rect x="510.0" y="330.0" width="240.0" height="86.0" rx="10" fill="#f8fafc" stroke="#b45309" stroke-width="1.5"/><text x="630.0" y="358.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700" opacity="1.0">AVX2 fallback</text><text x="630.0" y="380.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">AVX2 / scalar paths</text><text x="630.0" y="397.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">never execute PEXT</text><text x="48.0" y="452.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" opacity="1.0">Fallback is exercised by a thread-local no-BMI2 test on a BMI2 CPU and by cross-builds; production checks are independent.</text><text x="48.0" y="512.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" opacity="0.9">yolow64 0.2.0 · no runtime third-party dependencies</text>
</svg>
