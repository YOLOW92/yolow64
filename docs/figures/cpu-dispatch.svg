acSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">NEON vector loop on aarch64 · 4-char scalar table loop elsewhere</text><text x="466.0" y="388.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Identical byte output, padding bit checks, and InvalidByte offsets</text><text x="24.0" y="446.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">Verified by thread-local force_no_bmi2 / force_scalar tests and cross-architecture CI checks (src/cpu.rs).</text>
