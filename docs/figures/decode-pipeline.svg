ystem, sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700" opacity="1.0">short exact-length paths</text><rect x="48.0" y="300.0" width="276.0" height="100.0" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="186.0" y="328.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700" opacity="1.0">no-pad 16 / 32 / 64 / 128</text><text x="186.0" y="350.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">exact-length dispatch</text><text x="186.0" y="367.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">decode16 / block kernel</text><rect x="354.0" y="300.0" width="310.0" height="100.0" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="509.0" y="328.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700" opacity="1.0">padded 24 / 44 / 172</text><text x="509.0" y="350.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">128-bit head + BMI2 pext tail</text><text x="509.0" y="367.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">padding-bit checks</text><rect x="694.0" y="300.0" width="238.0" height="100.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="813.0" y="328.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#64748b" text-anchor="middle" font-weight="700" opacity="1.0">short-path contract</text><text x="813.0" y="350.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">every block validated</text><text x="813.0" y="367.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">same bytes / error offsets</text><text x="48.0" y="448.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" opacity="1.0">All paths validate every block and reject non-zero trailing bits. Feature fallback is shown in the CPU dispatch figure.</text><text x="48.0" y="512.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400" opacity="0.9">yolow64 0.2.0 · AVX2 and BMI2 are detected independently</text>
</svg>
