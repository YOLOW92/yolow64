<rect x="16.0" y="16.0" width="1028.0" height="74.0" rx="10" fill="url(#grad-header)"/><text x="34.0" y="46.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#ffffff" text-anchor="start" font-weight="700">v0.3.0 Decode Pipeline &amp; Exact-Length SIMD Kernels</text><text x="34.0" y="70.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="start" font-weight="400">Unified clean-room AVX2 hash network · Speculative validation · Dedicated short &amp; fused tail kernels</text><rect x="951.3" y="30.0" width="76.7" height="26.0" rx="13" fill="#b45309"/><text x="989.6" y="47.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle" font-weight="700">BMI2 PEXT</text><rect x="854.0" y="30.0" width="89.3" height="26.0" rx="13" fill="#1d4ed8"/><text x="898.6" y="47.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#dbeafe" text-anchor="middle" font-weight="700">XMM 128-bit</text><rect x="756.7" y="30.0" width="89.3" height="26.0" rx="13" fill="#0f766e"/><text x="801.4" y="47.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ccfbf1" text-anchor="middle" font-weight="700">YMM 256-bit</text><rect x="16.0" y="104.0" width="1028.0" height="168.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/><rect x="32.0" y="118.0" width="320.0" height="22.0" rx="11.0" fill="#ccfbf1"/><text x="192.0" y="132.8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="700">TIER 1 · BULK &amp; LARGE PAYLOADS (≥ 128 chars)</text><text x="364.0" y="133.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">Zero constant-memory loads inside hot loop; all 7 LUT/pack vectors stay in YMM registers</text><rect x="32.0" y="152.0" width="182.0" height="104.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><rect x="32.0" y="152.0" width="182.0" height="26.0" rx="8" fill="#f0fdfa"/><text x="123.0" y="170.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">1. 4×32B Load</text><text x="123.0" y="198.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">128 Base64 chars</text><text x="123.0" y="220.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">4× vmovdqu (YMM)</text><text x="123.0" y="242.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Prefetch +1024B</text><line x1="216.0" y1="204.0" x2="232.0" y2="204.0" stroke="#0f766e" stroke-width="2.0" marker-end="url(#arrow-teal)"/><rect x="234.0" y="152.0" width="182.0" height="104.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><rect x="234.0" y="152.0" width="182.0" height="26.0" rx="8" fill="#f0fdfa"/><text x="325.0" y="170.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">2. Hash Translate</text><text x="325.0" y="198.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">vpsrld + vpavgb</text><text x="325.0" y="220.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">delta_asso / values</text><text x="325.0" y="242.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">vpaddb 6-bit indices</text><line x1="418.0" y1="204.0" x2="434.0" y2="204.0" stroke="#0f766e" stroke-width="2.0" marker-end="url(#arrow-teal)"/><rect x="436.0" y="152.0" width="182.0" height="104.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><rect x="436.0" y="152.0" width="182.0" height="26.0" rx="8" fill="#f0fdfa"/><text x="527.0" y="170.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">3. Speculative Check</text><text x="527.0" y="198.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">check_asso / values</text><text x="527.0" y="220.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">vpaddsb &lt; 0 → vpor</text><text x="527.0" y="242.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Single ymm10 accum</text><line x1="620.0" y1="204.0" x2="636.0" y2="204.0" stroke="#0f766e" stroke-width="2.0" marker-end="url(#arrow-teal)"/><rect x="638.0" y="152.0" width="182.0" height="104.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><rect x="638.0" y="152.0" width="182.0" height="26.0" rx="8" fill="#f0fdfa"/><text x="729.0" y="170.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">4. Pack 96 Bytes</text><text x="729.0" y="198.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">vpmaddubsw → wd</text><text x="729.0" y="220.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">vpshufb 12B lanes</text><text x="729.0" y="242.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">8× 16B stores/iter</text><line x1="822.0" y1="204.0" x2="838.0" y2="204.0" stroke="#0f766e" stroke-width="2.0" marker-end="url(#arrow-teal)"/><rect x="840.0" y="152.0" width="182.0" height="104.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><rect x="840.0" y="152.0" width="182.0" height="26.0" rx="8" fill="#eff6ff"/><text x="931.0" y="170.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">5. Fused Tail</text><text x="931.0" y="198.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">tail44 (8K, 128B)</text><text x="931.0" y="220.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155" text-anchor="middle" font-weight="400">tail88 (16K–4M)</text><text x="931.0" y="242.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Single loop exit check</text><rect x="16.0" y="286.0" width="1028.0" height="152.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/><rect x="32.0" y="300.0" width="340.0" height="22.0" rx="11.0" fill="#dbeafe"/><text x="202.0" y="314.9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">TIER 2 · v0.3.0 DEDICATED PADDED SHORT KERNELS</text><text x="384.0" y="315.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">Eliminates multi-step helper calls and scalar tail bottlenecks for 8 B, 16 B, 32 B, and 64 B</text><rect x="32.0" y="332.0" width="236.0" height="94.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="44.0" y="352.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">decode12 · 8 B</text><rect x="201.2" y="338.0" width="58.8" height="18.0" rx="9.0" fill="#fef3c7"/><text x="230.6" y="350.1" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">XMM 128b</text><text x="44.0" y="376.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0f172a" text-anchor="start" font-weight="400">12 chars: u64+u16+u8+'A'</text><text x="44.0" y="395.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155" text-anchor="start" font-weight="400">1× XMM hash/validate/pack</text><text x="44.0" y="414.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0f766e" text-anchor="start" font-weight="700">_mm_extract_epi8::&lt;8&gt; → 5.47 ns</text><rect x="282.0" y="332.0" width="236.0" height="94.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="294.0" y="352.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">decode24 · 16 B</text><rect x="451.2" y="338.0" width="58.8" height="18.0" rx="9.0" fill="#fef3c7"/><text x="480.6" y="350.1" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">YMM 256b</text><text x="294.0" y="376.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0f172a" text-anchor="start" font-weight="400">24 chars: 0..16 &amp; 8..24 ('AA')</text><text x="294.0" y="395.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155" text-anchor="start" font-weight="400">Single 256-bit AVX2 pass</text><text x="294.0" y="414.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0f766e" text-anchor="start" font-weight="700">_mm_extract_epi8::&lt;4&gt; → 5.69 ns</text><rect x="532.0" y="332.0" width="236.0" height="94.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="544.0" y="352.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">decode44 · 32 B</text><rect x="695.6" y="338.0" width="64.4" height="18.0" rx="9.0" fill="#fef3c7"/><text x="727.8" y="350.1" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">YMM + XMM</text><text x="544.0" y="376.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0f172a" text-anchor="start" font-weight="400">44 chars: YMM 0..32 + XMM 28..44</text><text x="544.0" y="395.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155" text-anchor="start" font-weight="400">Shared LUT regs + 1× vptest</text><text x="544.0" y="414.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0f766e" text-anchor="start" font-weight="700">Contiguous 24B + 8B → 6.89 ns</text><rect x="782.0" y="332.0" width="236.0" height="94.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="794.0" y="352.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">decode88 · 64 B</text><rect x="940.0" y="338.0" width="70.0" height="18.0" rx="9.0" fill="#fef3c7"/><text x="975.0" y="350.1" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">2×YMM+PEXT</text><text x="794.0" y="376.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0f172a" text-anchor="start" font-weight="400">88 chars: 2×YMM + XMM 64..80</text><text x="794.0" y="395.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#334155" text-anchor="start" font-weight="400">BMI2 pext6_be on 80..86</text><text x="794.0" y="414.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0f766e" text-anchor="start" font-weight="700">Single fused fn → 10.96 ns</text><rect x="16.0" y="450.0" width="1028.0" height="72.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/><rect x="32.0" y="464.0" width="230.0" height="22.0" rx="11.0" fill="#fef3c7"/><text x="147.0" y="478.9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">TIER 3 · UNPADDED FAST PATHS</text><text x="276.0" y="479.0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">16c (12B: 5.04 ns) · 32c (24B: 7.87 ns) · 64c (48B: 9.69 ns) · 128c (96B: 13.02 ns)</text><text x="32.0" y="504.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155" text-anchor="start" font-weight="400">Strict Validation Contract: Every path validates 100% of blocks, rejects non-zero trailing padding bits, and reports the exact InvalidByte offset.</text><text x="24.0" y="548.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">yolow64 v0.3.0 · Clean-room SIMD architecture (src/avx2/decode.rs)</text>
