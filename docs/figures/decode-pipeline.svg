<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48.0" y="48.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">Decode pipeline</text><text x="48.0" y="74.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="400" opacity="1.0">Bulk AVX2 block path and the short exact-length / BMI2 pext paths.</text><text x="48.0" y="112.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700" opacity="1.0">bulk, one 32-character block</text><rect x="48.0" y="126.0" width="168.0" height="96.0" rx="10" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/><text x="132.0" y="154.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700" opacity="1.0">32 base64 chars</text><text x="132.0" y="176.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">256-bit load</text><text x="132.0" y="193.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">unaligned</text><line x1="216.0" y1="174.0" x2="246.0" y2="174.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="246.0" y="126.0" width="206.0" height="96.0" rx="10" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/><text x="349.0" y="154.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700" opacity="1.0">translate + validate</text><text x="349.0" y="176.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1.0">2